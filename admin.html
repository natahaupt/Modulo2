<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel en Vivo - CLARO</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 5px solid #EA2027; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card.especializado { border-left-color: #38bdf8; }
        .nombre { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #f8fafc; }
        .tipo { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; font-weight: bold; }
        .prompt { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-style: italic; font-size: 0.95rem; line-height: 1.4; color: #e2e8f0; }
    </style>
</head>
<body>

    <h1>Recepción de Prompts en Vivo 📡</h1>
    <div id="contenedorPrompts" class="grid">
        <p style="text-align:center; width:100%; color:#94a3b8;">Esperando las respuestas de los estudiantes...</p>
    </div>

    <!-- Cargar Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 🔴🔴🔴 PEGUE AQUÍ SU FIREBASE CONFIG 🔴🔴🔴
       const firebaseConfig = {
  apiKey: "AIzaSyA-bFIpc8iRrpmxKh8ih6spxQVytBmFw3I",
  authDomain: "cepies-claro.firebaseapp.com",
  projectId: "cepies-claro",
  storageBucket: "cepies-claro.firebasestorage.app",
  messagingSenderId: "448149004343",
  appId: "1:448149004343:web:038ff270958e703e7f9fb2",
  measurementId: "G-RDYHRK9LDT"
};
        // 🔴🔴🔴 FIN DEL CONFIG 🔴🔴🔴

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Escuchar datos en vivo
        const q = query(collection(db, "prompts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById("contenedorPrompts");
            contenedor.innerHTML = ""; 
            
            if (snapshot.empty) {
                contenedor.innerHTML = '<p style="text-align:center; width:100%; color:#94a3b8;">Esperando las respuestas de los estudiantes...</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement("div");
                const claseBorde = data.tipo.includes("Especializada") ? "especializado" : "";
                card.className = `card ${claseBorde}`;
                card.innerHTML = `
                    <div class="nombre">👤 ${data.nombre}</div>
                    <div class="tipo">🏷️ ${data.tipo}</div>
                    <div class="prompt">"${data.prompt}"</div>
                `;
                contenedor.appendChild(card);
            });
        });
    </script>
</body>
</html>
